<!doctype html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ridwan &amp; Razan</title>
<meta name="theme-color" content="#ffb703">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ridwan & Razan">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  body { font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif; background: #ffb703; color: #222; }
  .hidden { display: none !important; }
  button { font: inherit; border: 0; cursor: pointer; }

  /* ---------- home ---------- */
  #home { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
          padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
          background: radial-gradient(circle at 50% 20%, #ffd166, #ffb703 60%, #fb8500); }
  #home h1 { margin: 0; font-size: clamp(28px, 8vw, 44px); color: #fff; text-shadow: 0 3px 0 #c75d00; text-align: center; }
  .kids { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; width: 100%; }
  .kid { width: min(42vw, 230px); aspect-ratio: 3/4; border-radius: 32px; background: #fff; box-shadow: 0 10px 0 rgba(0,0,0,.18);
         display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; transition: transform .1s; }
  .kid:active { transform: translateY(6px) scale(.97); box-shadow: 0 4px 0 rgba(0,0,0,.18); }
  .kid .av { width: 78%; aspect-ratio: 1; object-fit: cover; border-radius: 50%; border: 6px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,.15); pointer-events: none; }
  .kid .nm { font-size: clamp(24px, 7vw, 36px); font-weight: 800; }
  .kid.r { background: linear-gradient(#e7f5ff, #a5d8ff); } .kid.r .nm { color: #1864ab; }
  .kid.z { background: linear-gradient(#fff0f6, #fcc2d7); } .kid.z .nm { color: #a61e4d; }

  #game { position: fixed; inset: 0; }

  /* parent gate */
  #exit { position: fixed; z-index: 20; top: max(10px, env(safe-area-inset-top)); left: 10px; width: 46px; height: 46px; border-radius: 50%;
          background: rgba(255,255,255,.75); font-size: 22px; box-shadow: 0 2px 6px rgba(0,0,0,.2); overflow: hidden; }
  #exit::after { content: ""; position: absolute; inset: 0; background: rgba(250,82,82,.5); transform: scaleY(0); transform-origin: bottom; }
  #exit.holding::after { transform: scaleY(1); transition: transform 1.5s linear; }

  /* caption (what the voice is saying) */
  #caption { position: fixed; z-index: 15; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translate(-50%, 30px);
             max-width: min(92vw, 560px); padding: 10px 16px; border-radius: 18px; background: rgba(0,0,0,.7); color: #fff;
             font-size: clamp(16px, 4.4vw, 22px); text-align: center; opacity: 0; transition: .25s; pointer-events: none; }
  #caption.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- moto ---------- */
  .moto { position: absolute; inset: 0; }
  .moto canvas { display: block; touch-action: none; }
  .moto .target { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
                  width: 104px; height: 104px; border-radius: 50%; background: #fff; border: 6px solid #fab005;
                  box-shadow: 0 6px 0 rgba(0,0,0,.2); display: grid; place-items: center; }
  .moto .target .ch { font-size: 64px; line-height: 1; font-family: "Geeza Pro", "Noto Naskh Arabic", Arial, sans-serif; font-weight: 700; }
  .moto .target .spk { position: absolute; right: -6px; bottom: -6px; font-size: 22px; background: #fab005; border-radius: 50%; width: 34px; height: 34px; display: grid; place-items: center; }
  .moto .target.pulse { animation: pulse .6s ease 2; }
  @keyframes pulse { 50% { transform: translateX(-50%) scale(1.15); } }
  .moto .stars { position: absolute; top: max(14px, env(safe-area-inset-top)); right: 12px; background: rgba(255,255,255,.85);
                 padding: 6px 12px; border-radius: 20px; font-size: 22px; font-weight: 800; }
  .moto .progress { position: absolute; left: 50%; transform: translateX(-50%); width: min(60vw, 300px); top: calc(max(10px, env(safe-area-inset-top)) + 118px); height: 12px;
                    background: rgba(255,255,255,.6); border-radius: 6px; overflow: hidden; }
  .moto .progress i { display: block; height: 100%; width: 0; background: #40c057; transition: width .4s; }
  .moto .done { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; padding: 16px; }
  .moto .done .me { width: 130px; height: 130px; border-radius: 50%; border: 6px solid #ffd43b; object-fit: cover; }
  .moto .done .trophy { font-size: 90px; animation: pulse2 1s ease infinite; }
  @keyframes pulse2 { 50% { transform: scale(1.1) rotate(-5deg); } }
  .moto .done h2 { font-size: clamp(28px, 8vw, 40px); margin: 8px 0; }
  .moto .learned { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; direction: rtl; margin: 6px 0 20px; }
  .moto .learned span { background: #fff; color: #222; border-radius: 14px; font-size: 34px; width: 54px; height: 54px; display: grid; place-items: center; font-family: "Geeza Pro", Arial, sans-serif; }
  /* motorbike or car? */
  .moto .choose { position: absolute; inset: 0; z-index: 8; background: rgba(0,0,0,.45); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; }
  .moto .choose h2 { margin: 0; color: #fff; font-size: clamp(40px, 12vw, 64px); text-shadow: 0 4px 0 #c92a2a; }
  .moto .choose .opts { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .moto .choose button { width: min(40vw, 220px); background: #fff; border-radius: 28px; padding: 10px; box-shadow: 0 8px 0 rgba(0,0,0,.25); display: flex; flex-direction: column; align-items: center; gap: 6px; animation: pickMe 1.4s ease-in-out infinite; }
  .moto .choose button:last-child { animation-delay: .7s; }
  .moto .choose button:active { transform: translateY(6px) scale(.96); }
  .moto .choose img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 20px; pointer-events: none; }
  .moto .choose span { font-size: clamp(20px, 6vw, 30px); font-weight: 900; }
  @keyframes pickMe { 50% { transform: scale(1.05) rotate(-2deg); } }
  /* paint shop */
  .moto .paint { position: absolute; left: 0; right: 0; bottom: 0; z-index: 8; padding: 18px 16px max(22px, env(safe-area-inset-bottom));
      background: linear-gradient(transparent, rgba(0,0,0,.55) 30%); display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .moto .paint h2 { position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 70px); left: 0; right: 0; text-align: center; margin: 0; color: #fff; font-size: clamp(32px, 9vw, 48px); text-shadow: 0 3px 0 #1864ab; }
  .moto .paint { background: linear-gradient(transparent, rgba(0,0,0,.35) 40%); }
  .moto .paint .swatches { display: flex; gap: 18px; }
  .moto .paint [data-c] { width: 78px; height: 78px; border-radius: 50%; background: var(--c); border: 6px solid rgba(255,255,255,.7);
      box-shadow: 0 6px 0 rgba(0,0,0,.25), inset 0 -8px 0 rgba(0,0,0,.12); transition: transform .15s; }
  .moto .paint [data-c].on { transform: scale(1.2); border-color: #ffd43b; box-shadow: 0 0 0 4px #fff, 0 0 24px 6px rgba(255,212,59,.8); }
  /* big "RIDWAN!" celebration */
  .moto .hero { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; z-index: 5; }
  .moto .hero .rays { position: absolute; width: 150vmax; height: 150vmax; opacity: .55;
      background: repeating-conic-gradient(from 0deg, rgba(255,212,59,.9) 0 10deg, transparent 10deg 20deg);
      -webkit-mask: radial-gradient(circle, #000 0, #000 15%, transparent 45%); mask: radial-gradient(circle, #000 0, #000 15%, transparent 45%);
      animation: spin 6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .moto .hero img { position: relative; width: min(46vw, 34vh, 260px); aspect-ratio: 1; border-radius: 50%; object-fit: cover;
      border: 8px solid #ffd43b; box-shadow: 0 0 0 6px #fff, 0 0 50px 12px rgba(255,212,59,.9); }
  .moto .hero .name { position: relative; margin-top: 12px; font-size: clamp(48px, 15vw, 96px); font-weight: 900; color: #ffd43b; letter-spacing: 2px;
      -webkit-text-stroke: 3px #c92a2a; paint-order: stroke fill; text-shadow: 0 6px 0 #c92a2a, 0 10px 20px rgba(0,0,0,.35); }
  .moto .hero .sub { position: relative; font-size: clamp(22px, 6.5vw, 36px); font-weight: 900; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.35); }
  .moto .hero.in img { animation: heroPop .6s cubic-bezier(.2,1.8,.4,1) both, wobble 1.2s ease-in-out .6s infinite; }
  .moto .hero.in .name { animation: heroPop .6s cubic-bezier(.2,1.8,.4,1) .12s both; }
  .moto .hero.in .sub { animation: heroPop .5s ease .25s both; }
  .moto .hero.out { animation: fadeOut .35s ease forwards; }
  @keyframes heroPop { from { transform: scale(0) rotate(-20deg); opacity: 0; } }
  @keyframes wobble { 50% { transform: rotate(6deg) scale(1.05); } }
  @keyframes fadeOut { to { opacity: 0; transform: scale(1.1); } }
  .moto .stars.pop { animation: starPop .5s ease; }
  @keyframes starPop { 40% { transform: scale(1.5); background: #ffd43b; } }
  .big { font-size: 28px; font-weight: 800; padding: 16px 34px; border-radius: 24px; background: #40c057; color: #fff; box-shadow: 0 6px 0 #2b8a3e; }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 #2b8a3e; }


  /* home: parent voice button */
  #recbtn { position: relative; overflow: hidden; margin-top: 6px; padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,.35); color: #fff; font-weight: 800; font-size: 15px; }
  #recbtn::after { content: ""; position: absolute; inset: 0; background: rgba(250,82,82,.45); transform: scaleX(0); transform-origin: left; }
  #recbtn.holding::after { transform: scaleX(1); transition: transform 1.5s linear; }

  /* parent recording screen */
  .rec { position: absolute; inset: 0; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; background: #fff8e7;
         padding: calc(max(10px, env(safe-area-inset-top)) + 56px) 16px 40px; }
  .rec header { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; }
  .rec header img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 4px solid #fcc2d7; flex: none; }
  .rec h2 { margin: 0 0 4px; font-size: 24px; } .rec header p { margin: 0; font-size: 14px; color: #555; }
  .rec h3 { margin: 22px 0 8px; font-size: 17px; color: #a61e4d; }
  .rec .line { display: flex; gap: 10px; align-items: center; justify-content: space-between; background: #fff; border-radius: 16px; padding: 10px 12px; margin-bottom: 8px; box-shadow: 0 2px 0 rgba(0,0,0,.06); }
  .rec .line.mine { background: #ebfbee; }
  .rec .line.recording { background: #fff0f0; outline: 3px solid #fa5252; }
  .rec .line.recording .mic { animation: pulse3 .8s ease infinite; }
  @keyframes pulse3 { 50% { transform: scale(1.2); } }
  .rec .txt { font-size: 15px; line-height: 1.35; }
  .rec .who { color: #2b8a3e; font-weight: 700; font-size: 13px; }
  .rec .btns { display: flex; gap: 4px; flex: none; }
  .rec .btns > * { width: 40px; height: 40px; border-radius: 12px; background: #f1f3f5; font-size: 18px; display: grid; place-items: center; cursor: pointer; }
  .rec .line:not(.mine) .reset { visibility: hidden; }
  .rec .hint { text-align: center; color: #888; font-size: 13px; margin-top: 20px; }

  /* mom cheering beside the road */
  .moto .fan { position: absolute; top: 44%; width: 64px; pointer-events: none; z-index: 4; text-align: center; }
  .moto .fan.mom { left: 2px; } .moto .fan.dad { right: 2px; top: 58%; }
  .moto .fan img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 4px solid #f783ac; box-shadow: 0 4px 10px rgba(0,0,0,.25); background: #fff; }
  .moto .fan .poms { position: absolute; top: 32px; left: -8px; right: -8px; display: flex; justify-content: space-between; font-size: 24px; }
  .moto .fan .tag { display: inline-block; margin-top: -6px; position: relative; background: #f783ac; color: #fff; font-weight: 900; font-size: 12px; padding: 2px 8px; border-radius: 10px; }
  .moto .fan .bubble { position: absolute; left: 62px; top: -6px; z-index: 6; width: max-content; max-width: 46vw; background: #fff; color: #a61e4d; font-weight: 900; font-size: clamp(14px, 3.8vw, 18px);
                       padding: 8px 12px; border-radius: 16px; border: 3px solid #f783ac; opacity: 0; transform: scale(.4); transform-origin: left center; transition: .2s; }
  .moto .fan .bubble::before { content: ""; position: absolute; left: -10px; top: 14px; border: 7px solid transparent; border-right-color: #f783ac; }
  .moto .fan.cheer .bubble { opacity: 1; transform: none; }
  .moto .fan.dad img { border-color: #4dabf7; } .moto .fan.dad .tag { background: #339af0; }
  .moto .fan.dad .bubble { left: auto; right: 62px; color: #1864ab; border-color: #4dabf7; transform-origin: right center; }
  .moto .fan.dad .bubble::before { left: auto; right: -10px; border-right-color: transparent; border-left-color: #4dabf7; }
  .moto .fan { animation: momIdle 2.4s ease-in-out infinite; }
  .moto .fan.cheer { animation: momCheer .45s ease-in-out infinite; }
  .moto .fan.cheer .poms span:first-child { animation: pomL .3s ease-in-out infinite alternate; }
  .moto .fan.cheer .poms span:last-child { animation: pomR .3s ease-in-out infinite alternate; }
  @keyframes momIdle { 50% { transform: translateY(-4px) rotate(-2deg); } }
  @keyframes momCheer { 50% { transform: translateY(-14px) scale(1.08); } }
  @keyframes pomL { to { transform: translateY(-14px) rotate(-25deg); } }
  @keyframes pomR { to { transform: translateY(-14px) rotate(25deg); } }
  /* speech bubbles sit BELOW the parent's photo so they never cover the letters */
  .moto .fan .bubble, .moto .fan.dad .bubble { top: 96px; left: 50%; right: auto; width: 118px; max-width: none; transform: translateX(-50%) scale(.4);
      transform-origin: top center; font-size: 13px; padding: 5px 6px; text-align: center; }
  .moto .fan.mom .bubble { left: 4px; transform: scale(.4); transform-origin: top left; }
  .moto .fan.dad .bubble { left: auto; right: 4px; transform: scale(.4); transform-origin: top right; }
  .moto .fan.cheer .bubble { transform: none !important; }
  .moto .fan .bubble::before, .moto .fan.dad .bubble::before { top: -14px; left: 22px; right: auto; border: 7px solid transparent; border-bottom-color: #f783ac; }
  .moto .fan.dad .bubble::before { left: auto; right: 22px; border-bottom-color: #4dabf7; border-left-color: transparent; }
  /* 3D race */
  .race3d canvas.gl { display: block; position: absolute; inset: 0; touch-action: none; }
  .race3d .speed { position: absolute; right: 12px; bottom: max(16px, env(safe-area-inset-bottom)); background: rgba(0,0,0,.55); color: #fff;
      border-radius: 16px; padding: 6px 12px; font-weight: 900; font-size: 26px; font-variant-numeric: tabular-nums; z-index: 3; }
  .race3d .speed small { font-size: 12px; margin-left: 3px; opacity: .8; }
  /* driver card (his face lives here, never over the road) */
  .race3d .driver { position: absolute; left: 10px; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 3; display: flex; flex-direction: column; align-items: center; }
  .race3d .driver img { width: 74px; height: 74px; border-radius: 50%; object-fit: cover; border: 4px solid #ffd43b; box-shadow: 0 0 0 3px #c92a2a, 0 6px 14px rgba(0,0,0,.35); }
  .race3d .driver span { margin-top: -10px; background: linear-gradient(#e03131, #a61e1e); color: #fff; font-weight: 900; font-size: 13px; letter-spacing: 1px; padding: 2px 10px; border-radius: 8px; border: 2px solid #ffd43b; }
  .race3d .driver.pop img { animation: driverPop .9s ease; }
  @keyframes driverPop { 30% { transform: scale(1.35) rotate(-8deg); box-shadow: 0 0 0 3px #c92a2a, 0 0 30px 10px rgba(255,212,59,.9); } }
  .rec .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .rec .ph { position: relative; background: #fff; border-radius: 16px; padding: 8px; text-align: center; cursor: pointer; box-shadow: 0 2px 0 rgba(0,0,0,.06); }
  .rec .ph img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; display: block; }
  .rec .ph span { display: block; font-size: 12px; font-weight: 700; margin-top: 4px; }
  .rec .ph.set { outline: 3px solid #69db7c; }
  .rec .ph .rm { position: absolute; top: 2px; right: 2px; width: 26px; height: 26px; border-radius: 50%; background: #fa5252; color: #fff; font-size: 13px; display: none; }
  .rec .ph.set .rm { display: grid; place-items: center; }
  /* thumb controls */
  .race3d .steer { position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); z-index: 5; width: 92px; height: 92px; border-radius: 50%;
      background: rgba(255,255,255,.88); box-shadow: 0 6px 0 rgba(0,0,0,.22), 0 8px 18px rgba(0,0,0,.25); display: grid; place-items: center;
      touch-action: none; -webkit-user-select: none; user-select: none; }
  .race3d .steer.left { left: 16px; } .race3d .steer.right { right: 16px; }
  .race3d .steer svg { width: 54px; height: 54px; fill: none; stroke: #1c7ed6; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
  .race3d .steer.press { animation: steerPress .18s ease; }
  @keyframes steerPress { 50% { transform: scale(.86); background: #ffd43b; } }
  .race3d .steer.hint { animation: steerHint 1.4s ease-in-out infinite; }
  .race3d .steer.hint.press { animation: steerPress .18s ease; }
  @keyframes steerHint { 50% { transform: scale(1.08); box-shadow: 0 6px 0 rgba(0,0,0,.22), 0 0 0 10px rgba(255,212,59,.55); } }
  /* make room: driver card + speed go to the top */
  .race3d .driver { top: calc(max(10px, env(safe-area-inset-top)) + 56px); bottom: auto; left: 10px; }
  .race3d .driver img { width: 58px; height: 58px; }
  .race3d .speed { top: calc(max(10px, env(safe-area-inset-top)) + 52px); bottom: auto; font-size: 20px; padding: 4px 10px; }
  #ver { position: absolute; bottom: max(6px, env(safe-area-inset-bottom)); right: 10px; font-size: 11px; color: rgba(255,255,255,.75); font-weight: 700; }
  /* ---------- baby ---------- */
  .baby { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: background .5s; overflow: hidden; }
  .baby .thing { line-height: 0; }
  .baby .photo { width: min(84vw, 58vh, 560px); aspect-ratio: 1; object-fit: cover; border-radius: 36px; border: 10px solid #fff; box-shadow: 0 14px 0 rgba(0,0,0,.12); pointer-events: none; }
  .baby .thing.enter { animation: enter .5s cubic-bezier(.3,1.6,.5,1); }
  .baby .thing.bounce { animation: bounce .5s ease; }
  @keyframes enter { from { transform: scale(0) rotate(-30deg); } }
  @keyframes bounce { 30% { transform: scale(1.18) rotate(-6deg); } 60% { transform: scale(.94) rotate(4deg); } }
  .baby .word { font-size: clamp(40px, 13vw, 80px); font-weight: 900; color: #343a40; -webkit-text-stroke: 2px #fff; paint-order: stroke fill; text-shadow: 0 4px 0 rgba(255,255,255,.6); margin-top: 10px; }
  .heart { position: absolute; font-size: 34px; pointer-events: none; transform: translate(-50%, -50%); animation: fly 1s ease-out forwards; }
  @keyframes fly { to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.4); opacity: 0; } }
</style>
</head>
<body>
  <main id="home">
    <h1>Ridwan &amp; Razan</h1>
    <div class="kids">
      <button class="kid r" data-kid="ridwan"><img class="av" data-photo="ridwan" alt=""><span class="nm">Ridwan</span></button>
      <button class="kid z" data-kid="razan"><img class="av" data-photo="razan" alt=""><span class="nm">Razan</span></button>
    </div>
    <div id="ver">v17</div>
    <button id="recbtn" aria-label="Record family voices (hold)">🎙️ <span>Qoyska · photos & voices · hold</span></button>
  </main>
  <div id="game" class="hidden"></div>
  <button id="exit" class="hidden" aria-label="Home (hold)">🏠</button>
  <div id="caption"></div>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
